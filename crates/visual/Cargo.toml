[package]
name = "zeron-visual"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Sandboxed Luau runtime for agent visuals: scripts build a native element tree, canvas drawings, and 3D scenes"

[dependencies]
mlua = { version = "0.12", features = ["luau"] }
# The GLSL compiler wgpu uses, so a shader is validated exactly as it will run.
naga = { version = "29", features = ["glsl-in"] }
thiserror.workspace = true
